[project]
name = "support-assistant"
version = "0.1.0"
description = "AI Support Assistant: turns customer messages into a summary, sentiment, reply and next action, using local Granite, Llama and Mistral models via Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3",
    "httpx>=0.27",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "ollama>=0.6",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
